spring.application.name=umai
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/okuulib_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgresuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

umai.app.secret=${JWT_SECRET}
umai.app.isproduction=${SPRING_PROFILES_ACTIVE:false}
ALLOWED_ORIGINS=${ALLOWED_ORIGINS:*}

dropbox.access.token=${DROPBOX_TOKEN}
dropbox.root.path=/umai-temp-storage
dropbox.cleanup.enabled=false
dropbox.cleanup.days-old=1488

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

okuulib.ai.ask_endpoint=${AI_ENDPOINT:/retrieval/ask}